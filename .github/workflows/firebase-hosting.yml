name: Deploy Advisory Board to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advisory-board-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'BSUTAD/Advisory-Board' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Check dependencies
        run: npm audit --audit-level=high
      - name: Test website and redirects
        run: npm test && npm run test:migration
      - name: Build public website
        run: npm run build:hosting
      - name: Record deployed revision
        run: node -e "require('fs').writeFileSync('hosting-dist/deployment.json', JSON.stringify({revision:process.env.GITHUB_SHA, repository:process.env.GITHUB_REPOSITORY}))"
      - name: Authenticate for Hosting only
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: tad-advisory-board
          workload_identity_provider: projects/759590399835/locations/global/workloadIdentityPools/advisory-github/providers/github
          service_account: github-hosting@tad-advisory-board.iam.gserviceaccount.com
      - name: Publish website
        run: npx --no-install firebase deploy --only hosting --project tad-advisory-board --non-interactive
      - name: Verify published revision
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          expected = os.environ['EXPECTED_REVISION']
          for attempt in range(6):
              try:
                  url = 'https://tad-advisory-board.web.app/deployment.json?revision=' + expected
                  with urllib.request.urlopen(url, timeout=15) as response:
                      if json.load(response).get('revision') == expected:
                          print('Verified published revision:', expected)
                          break
              except Exception as error:
                  print('Waiting for publication:', error)
              if attempt == 5:
                  raise SystemExit('Published revision did not match this commit')
              time.sleep(5)
          PY
